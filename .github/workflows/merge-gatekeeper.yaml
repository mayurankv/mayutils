name: Merge Gatekeeper

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  merge-gatekeeper:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Run Merge Gatekeeper
        uses: upsidr/merge-gatekeeper@b4c7f4e9c642b0f8430923df38afdcb6f34a90f4 # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
