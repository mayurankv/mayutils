name: Merge Gatekeeper

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  merge-gatekeeper:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Run Merge Gatekeeper
        uses: upsidr/merge-gatekeeper@add091929d8a799ca3f4d287b3485e6dc2b679c1 # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
